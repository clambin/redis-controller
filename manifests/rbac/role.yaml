---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-controller
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - redis.agrajag.be
  resources:
  - redisinstances
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - redis.agrajag.be
  resources:
  - redisinstances/finalizers
  verbs:
  - update
- apiGroups:
  - redis.agrajag.be
  resources:
  - redisinstances/status
  verbs:
  - get
  - patch
  - update
