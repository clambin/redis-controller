metadata:
  labels:
    app.kubernetes.io/name: test
  name: test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: test
  strategy: {}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test
    spec:
      containers:
      - args:
        - --appendonly
        - "yes"
        - --appendfsync
        - everysec
        image: redis:latest
        imagePullPolicy: IfNotPresent
        name: redis
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: redis-data
      restartPolicy: Always
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data
status: {}
